general:
  world_frame: "map"
  logging_level: debug
  allow_reset_map_service: true

map:
  type: hashed_wavelet_octree
  min_cell_width: { meters: 0.06 }

map_operations:
  - type: threshold_map
    once_every: { seconds: 2.0 }
  - type: prune_map
    once_every: { seconds: 10.0 }
  - type: publish_map
    once_every: { seconds: 2.0 }
  - type: publish_esdf
    once_every: { seconds: 1.0 }
    max_distance: 4.0
    occupancy_threshold: 0.0
    # Octree height at which the ESDF is computed. 0 = finest resolution
    # (0.06m, matches map.min_cell_width). Each level up doubles the cell
    # width (1 -> 0.12m, 2 -> 0.24m, ...), trading resolution for speed.
    tree_height: 0
    topic: "esdf"

measurement_integrators:
  jt128_lidar_left:
    projection_model:
      type: lidar_channel_projector
      # JT128 Mini's 128 channels are not evenly spaced, so a uniform
      # spherical_projector elevation grid causes ~15/128 rows to collide
      # (2 real channels rounding to the same row) and ~15/128 rows to be
      # permanently empty (no channel rounds there), every frame. This
      # projector instead loads each channel's real elevation angle and
      # looks it up via binary search, so every channel gets its own exact
      # row -- see JT128_default_angle.csv (also used as the real driver's
      # PTC-correction fallback table, see alma_jt128_dual.yaml).
      elevation_angles_file: "$(find wavemap_ros)/config/sensor_configs/JT128_default_angle.csv"
      azimuth:
        # JT128 Mini @ 10 Hz: 900 unique azimuth samples/revolution (0.4 deg
        # resolution, see jt128.csv / dynaarm_jt128.urdf.xacro samples=115200)
        # -- too slow, so we reduce it in sim to 360
        num_cells: 360
        min_angle: { degrees: -180.0 }
        max_angle: { degrees: 180.0 }
    measurement_model:
      type: continuous_beam
      angle_sigma: { degrees: 0.1 }
      range_sigma: { meters: 0.02 }
      scaling_free: 0.2
      scaling_occupied: 0.4
    integration_method:
      type: hashed_wavelet_integrator
      # Must exceed 6*range_sigma (0.12m): below that, phantom range-image
      # pixels from elevation rows the JT128 never hits (read as range=0)
      # pass the min_range cutoff but aren't yet caught by continuous_beam's
      # own fully_in_unknown_space check, leaking a small positive occupied
      # update on every azimuth column, every frame -> a ring of occupied
      # cells that accumulates right around the sensor.
      min_range: { meters: 0.15 }
      max_range: { meters: 4.0 }

  jt128_lidar_right:
    projection_model:
      type: lidar_channel_projector
      # JT128 Mini's 128 channels are not evenly spaced, so a uniform
      # spherical_projector elevation grid causes ~15/128 rows to collide
      # (2 real channels rounding to the same row) and ~15/128 rows to be
      # permanently empty (no channel rounds there), every frame. This
      # projector instead loads each channel's real elevation angle and
      # looks it up via binary search, so every channel gets its own exact
      # row -- see JT128_default_angle.csv (also used as the real driver's
      # PTC-correction fallback table, see alma_jt128_dual.yaml).
      elevation_angles_file: "$(find wavemap_ros)/config/sensor_configs/JT128_default_angle.csv"
      azimuth:
        # JT128 Mini @ 10 Hz: 900 unique azimuth samples/revolution (0.4 deg
        # resolution, see jt128.csv / dynaarm_jt128.urdf.xacro samples=115200)
        # -- too slow, so we reduce it in sim to 360
        num_cells: 360
        min_angle: { degrees: -180.0 }
        max_angle: { degrees: 180.0 }
    measurement_model:
      type: continuous_beam
      angle_sigma: { degrees: 0.1 }
      range_sigma: { meters: 0.02 }
      scaling_free: 0.2
      scaling_occupied: 0.4
    integration_method:
      type: hashed_wavelet_integrator
      # Must exceed 6*range_sigma (0.12m): below that, phantom range-image
      # pixels from elevation rows the JT128 never hits (read as range=0)
      # pass the min_range cutoff but aren't yet caught by continuous_beam's
      # own fully_in_unknown_space check, leaking a small positive occupied
      # update on every azimuth column, every frame -> a ring of occupied
      # cells that accumulates right around the sensor.
      min_range: { meters: 0.15 }
      max_range: { meters: 4.0 }

inputs:
  - type: pointcloud_topic
    topic_name: "/hesai/lidar_left/self_filtered"
    topic_type: PointCloud2
    measurement_integrator_names: jt128_lidar_left
    undistort_motion: false
    topic_queue_length: 1
    max_wait_for_pose: { seconds: 1.0 }

  - type: pointcloud_topic
    topic_name: "/hesai/lidar_right/self_filtered"
    topic_type: PointCloud2
    measurement_integrator_names: jt128_lidar_right
    undistort_motion: false
    topic_queue_length: 1
    max_wait_for_pose: { seconds: 1.0 }
