  livox_lidar_left:
    projection_model:
      type: spherical_projector
      elevation:
        num_cells: 32
        min_angle: { degrees: -7.0 }
        max_angle: { degrees: 52.0 }
      azimuth:
        num_cells: 512
        min_angle: { degrees: -180.0 }
        max_angle: { degrees: 180.0 }
    measurement_model:
      type: continuous_beam
      angle_sigma: { degrees: 0.05 }
      range_sigma: { meters: 0.015 }
      scaling_free: 0.2
      scaling_occupied: 0.4
    integration_method:
      type: hashed_wavelet_integrator
      min_range: { meters: 0.1 }
      max_range: { meters: 4.0 }

